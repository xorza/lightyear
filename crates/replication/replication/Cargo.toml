[package]
name = "lightyear_replication"
version = "0.30.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IO primitives for the lightyear networking library"
repository = "https://github.com/cBournhonesque/lightyear"

[features]
default = []
client = ["lightyear_sync/client"]
server = ["lightyear_connection/server"]
prediction = []
interpolation = []
trace = []
metrics = ["dep:metrics", "lightyear_utils/metrics"]
test_utils = []

[dependencies]
lightyear_link.workspace = true
lightyear_utils.workspace = true
lightyear_serde.workspace = true
lightyear_core.workspace = true
lightyear_connection.workspace = true
# `replicon` lets message (de)serialization read replicon's shared entity map
# instead of a per-connection copy.
lightyear_messages = { workspace = true, features = ["replicon"] }
lightyear_transport.workspace = true
lightyear_sync = { workspace = true, optional = true }

# utils
indexmap.workspace = true
metrics = { workspace = true, optional = true }
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
seahash.workspace = true
fixedbitset.workspace = true

# serde
serde.workspace = true
bytes.workspace = true

# bevy
bevy_app.workspace = true
bevy_derive.workspace = true
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_math.workspace = true
bevy_platform.workspace = true
bevy_ptr.workspace = true
bevy_reflect.workspace = true
bevy_time = { workspace = true, features = ["bevy_reflect"] }
bevy_transform = { workspace = true, features = ["libm"] }
bevy_state.workspace = true
bevy_utils.workspace = true

# replication
bevy_replicon.workspace = true

[dev-dependencies]
test-log.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
