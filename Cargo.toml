[workspace]
resolver = "3"
members = [
  "crates/core/lightyear",
  "crates/io/crossbeam",
  "crates/io/link",
  "crates/connection/connection",
  "crates/connection/raw_connection",
  "crates/core/core",
  "crates/core/sync",
  "crates/core/utils",
  "crates/core/frame_interpolation",
  "crates/replication/replication",
  "crates/replication/prediction",
  "crates/replication/interpolation",
  "crates/transport/serde",
  "crates/transport/transport",
  "crates/transport/messages",
  "crates/tools/metrics",
  "crates/tools/ui",
  "crates/tools/tools",
  "crates/tests",
  # internal
  "benches/*",
]
default-members = ["crates/core/lightyear"]
exclude = []


[workspace.package]
version = "0.30.1"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# If your own code does CPU-intensive work, you might want to also enable some optimization for it.
# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Here is a configuration for the most aggressive optimizations possible
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false


[workspace.dependencies]
lightyear_connection = { path = "crates/connection/connection", version = "0.30.1", default-features = false }
lightyear_core = { path = "crates/core/core", version = "0.30.1", default-features = false }
lightyear_crossbeam = { path = "crates/io/crossbeam", version = "0.30.1", default-features = false }
lightyear_frame_interpolation = { path = "crates/core/frame_interpolation", version = "0.30.1", default-features = false }
lightyear_interpolation = { path = "crates/replication/interpolation", version = "0.30.1", default-features = false }
lightyear_messages = { path = "crates/transport/messages", version = "0.30.1", default-features = false }
lightyear_metrics = { path = "crates/tools/metrics", version = "0.30.1", default-features = false }
lightyear = { path = "crates/core/lightyear", version = "0.30.1", default-features = false }
lightyear_transport = { path = "crates/transport/transport", version = "0.30.1", default-features = false }
lightyear_prediction = { path = "crates/replication/prediction", version = "0.30.1", default-features = false }
lightyear_link = { path = "crates/io/link", version = "0.30.1", default-features = false }
lightyear_raw_connection = { path = "crates/connection/raw_connection", version = "0.30.1", default-features = false }
lightyear_replication = { path = "crates/replication/replication", version = "0.30.1", default-features = false }
lightyear_serde = { path = "crates/transport/serde", version = "0.30.1", default-features = false }
lightyear_sync = { path = "crates/core/sync", version = "0.30.1", default-features = false }
lightyear_tools = { path = "crates/tools/tools", version = "0.30.1", default-features = false }
lightyear_utils = { path = "crates/core/utils", version = "0.30.1", default-features = false }
lightyear_tests = { path = "crates/tests", version = "0.30.1", default-features = false }

# utils
clap = { version = "4.5.4", features = ["derive"] }
chrono = "0.4.38"
fixed = { version = "1.29", features = ["serde"] }
fixedbitset = "0.5.7"
governor = "0.10"
hashbrown = { version = "0.17", default-features = false }
indexmap = { version = "2.9.0", default-features = false }
nonzero_ext = "0.3.0"
parking_lot = "0.12.3"
pastey = { version = "0.2.3", default-features = false }
rand = "0.10"
ringbuffer = "0.16"
thiserror = "2.0.3"
seahash = "4.1.0"
smallvec = { version = "1", features = ["union", "const_generics", "serde"] }
variadics_please = "2.0.0"

# serialization
postcard = { version = "1.1.3", default-features = false }
bytes = { version = "1.8", features = ["serde"] }
lz4_flex = { version = "0.14.0", default-features = false, features = [
  "safe-encode",
  "safe-decode",
  "checked-decode",
] }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = "1"

# tracing
test-log = { version = "0.2.17", default-features = false, features = [
  "trace",
  "color",
] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = [
  "registry",
  "env-filter",
] }

# doc
document-features = "0.2.11"

# server
crossbeam-channel = { version = "0.5.15", features = [] }

# metrics
metrics = "0.24"
metrics-util = "0.20"

# io
aeronet_io = { version = "0.21" }

# dev deps
mock_instant = "0.6"
approx = "0.5.1"
dhat = "0.3.3"
stats_alloc = "0.1.10"

# Bevy
bevy = { version = "0.19", default-features = false, features = [
  "bevy_state",
  "bevy_log",
  "serialize",
  "bevy_asset",
  "bevy_color",
  "multi_threaded",
  "sysinfo_plugin",
  "zstd_rust",
  "keyboard",
] }
bevy_app = { version = "0.19", default-features = false }
bevy_derive = { version = "0.19", default-features = false }
bevy_log = { version = "0.19", default-features = false }
bevy_diagnostic = { version = "0.19", default-features = false }
bevy_color = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy_math = { version = "0.19", default-features = false, features = ["std"] }
bevy_platform = { version = "0.19", default-features = false, features = ["std"] }
bevy_ptr = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false, features = ["std"] }
bevy_state = { version = "0.19", default-features = false }
bevy_text = { version = "0.19", default-features = false }
bevy_time = { version = "0.19", default-features = false }
bevy_transform = { version = "0.19", default-features = false }
bevy_ui = { version = "0.19", default-features = false }
bevy_utils = { version = "0.19", default-features = false, features = [
  "debug",
] }
tracy-client = { version = "0.18" }

# replication
bevy_replicon = { version = "0.44.1", default-features = false, features = [
  "client",
  "server",
] }

[workspace.lints.rust]
dead_code = "allow"
unused_variables = "allow"

[workspace.lints.clippy]
type_complexity = "allow"
missing_transmute_annotations = "allow"
len_without_is_empty = "allow"
too_many_arguments = "allow"
module_inception = "allow"
